<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- crossorigin: 서비스 워커가 글꼴 CSS를 CORS 응답으로 캐시하게(opaque 응답은 저장 용량을 크게 차지한다) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" crossorigin />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>갈무리부엌 · 사둔 재료, 남김없이 챙겨요</title>
    <meta name="description" content="영수증·냉장고 사진으로 재고를 넣고, 곧 먹어야 할 재료로 레시피·식단·장보기까지 이어줘요." />
    <!-- 링크 미리보기(카카오톡·슬랙 등). og.png는 서비스 워커가 미리 받지 않는다(scripts/sw-precache.mjs) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="갈무리부엌" />
    <meta property="og:title" content="갈무리부엌 · 사둔 재료, 남김없이 챙겨요" />
    <meta property="og:description" content="영수증·냉장고 사진으로 재고를 넣고, 곧 먹어야 할 재료로 레시피·식단·장보기까지 이어줘요." />
    <meta property="og:url" content="https://galmuri-kitchen.onrender.com/" />
    <meta property="og:image" content="https://galmuri-kitchen.onrender.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      .boot-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #f3f4f6; color: #17191c; font: 700 24px/1.4 "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; letter-spacing: -0.4px; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .boot-splash { background: #0e0f11; color: #f1f2f4; } }
      :root[data-theme="dark"] .boot-splash { background: #0e0f11; color: #f1f2f4; }
    </style>
    <!-- 화면 테마: 첫 화면을 그리기 전에 적용해 깜빡이지 않게 한다. 같은 동작을 더보기(applyTheme)에서도 한다 -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = t === "dark" ? "#0e0f11" : "#f3f4f6"; });
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><div class="boot-splash" aria-hidden="true"><img src="/mark.svg" width="96" height="96" alt="" />갈무리부엌</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
