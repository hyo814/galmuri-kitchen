<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; background: #F3F4F6; }
    a { color: #0F9D63; } a:hover { color: #0B7A4C; }
  </style>
</helmet>
<div style="position: relative; width: 384px; height: 832px; overflow: hidden; background: #F3F4F6; color: #17191C; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;">
  <div style="padding: 28px 20px 0 20px;">
    <div style="font-size: 26px; line-height: 34px; font-weight: 700; letter-spacing: -0.5px;">내 냉장고</div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(15, 17, 20, 0.48);"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 16px; padding: 12px 20px 24px 20px; background: #FFFFFF; border-radius: 24px 24px 0 0;">
    <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #E1E4E8;"></div>
    <div style="font-size: 22px; line-height: 30px; font-weight: 700; letter-spacing: -0.4px;">위치 관리</div>

    <div style="display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; gap: 8px; min-height: 64px;">
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
          <div style="font-size: 17px; line-height: 25px; font-weight: 600;">냉장실</div>
          <div style="font-size: 14px; line-height: 20px; color: #8B919A;">냉장 · 재료 3개</div>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #8B919A;"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; min-height: 64px;">
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
          <div style="font-size: 17px; line-height: 25px; font-weight: 600;">냉동실</div>
          <div style="font-size: 14px; line-height: 20px; color: #8B919A;">냉동 · 재료 1개</div>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #8B919A;"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; min-height: 64px;">
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
          <div style="font-size: 17px; line-height: 25px; font-weight: 600;">김치냉장고</div>
          <div style="font-size: 14px; line-height: 20px; color: #8B919A;">냉장 · 재료 1개</div>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #8B919A;"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; min-height: 64px;">
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
          <div style="font-size: 17px; line-height: 25px; font-weight: 600;">실온</div>
          <div style="font-size: 14px; line-height: 20px; color: #8B919A;">실온 · 비어 있음</div>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #8B919A;"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; min-height: 64px;">
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
          <div style="font-size: 17px; line-height: 25px; font-weight: 600;">찬장</div>
          <div style="font-size: 14px; line-height: 20px; color: #8B919A;">실온 · 재료 1개</div>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #8B919A;"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></div>
      </div>
      <div style="font-size: 13px; line-height: 19px; color: #8B919A; padding-top: 4px;">재료가 들어 있는 위치는 비운 뒤에 삭제할 수 있어요.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 1px solid #EEF0F2;">
      <div style="font-size: 14px; line-height: 20px; font-weight: 500; color: #5B616B;">새 위치</div>
      <div style="display: flex; align-items: center; height: 52px; padding: 0 16px; border-radius: 14px; background: #F3F4F6; font-size: 17px; color: #9097A1;">예: 베란다</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #F3F4F6;">
        <div style="display: flex; align-items: center; justify-content: center; height: 40px; border-radius: 10px; color: #5B616B; font-size: 15px; font-weight: 500;">냉장</div>
        <div style="display: flex; align-items: center; justify-content: center; height: 40px; border-radius: 10px; color: #5B616B; font-size: 15px; font-weight: 500;">냉동</div>
        <div style="display: flex; align-items: center; justify-content: center; height: 40px; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(15, 17, 20, 0.12); color: #17191C; font-size: 15px; font-weight: 600;">실온</div>
      </div>
      <div style="font-size: 13px; line-height: 19px; color: #8B919A; text-wrap: pretty;">냉장은 구입 7일, 냉동은 60일이 지나면 ‘오래됨’으로 표시해요. 실온은 표시하지 않아요.</div>
      <div style="display: flex; align-items: center; justify-content: center; height: 56px; margin-top: 4px; border-radius: 16px; background: #0F9D63; color: #FFFFFF; font-size: 17px; font-weight: 600;">위치 추가</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
